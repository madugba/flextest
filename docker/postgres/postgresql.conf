# PostgreSQL Configuration for High-Performance Production
# Optimized for 4GB RAM, 4 CPU cores, SSD storage
# Adjust based on your server specifications

# -----------------------------
# Connection Settings
# -----------------------------
max_connections = 200
superuser_reserved_connections = 3

# -----------------------------
# Memory Settings
# -----------------------------
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 16MB
temp_buffers = 8MB

# -----------------------------
# WAL (Write-Ahead Logging)
# -----------------------------
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_compression = on

# -----------------------------
# Query Planner
# -----------------------------
random_page_cost = 1.1  # SSD optimized
effective_io_concurrency = 200
default_statistics_target = 100

# -----------------------------
# Parallel Query Execution
# -----------------------------
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 4

# -----------------------------
# Performance Tuning
# -----------------------------
synchronous_commit = off  # Better performance, acceptable risk for cache layer
fsync = on
full_page_writes = on
commit_delay = 0
commit_siblings = 5

# -----------------------------
# Autovacuum
# -----------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 200

# -----------------------------
# Logging
# -----------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'
log_statement = 'none'
log_duration = off
log_min_duration_statement = 1000  # Log queries slower than 1s

# -----------------------------
# Query Statistics
# -----------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# -----------------------------
# Locale Settings
# -----------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
