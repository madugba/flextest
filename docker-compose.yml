# FlexTest - Full Stack Docker Compose Configuration
# ====================================================
# Orchestrates both frontend and backend with all dependencies
# Includes: Frontend (Next.js), Backend (Fastify), PostgreSQL, Redis, PgBouncer
#
# Quick Start:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop services
#
# For production scale (5M+ concurrent users):
#   docker compose up -d --scale flextest-backend=10
#
# Environment Configuration:
#   All services use common environment variables from docker/config/common.env

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    platform: linux/amd64
    image: postgres:16-alpine
    container_name: flextest-postgres
    restart: unless-stopped
    env_file:
      - docker/config/common.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flextest_db}
      POSTGRES_USER: ${POSTGRES_USER:-prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QSbM08uqLc7nK81WZfw53/ID+fJ6UAL8}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    ports:
      - "5432:5432"

    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c work_mem=16MB
      -c max_connections=200
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c password_encryption=md5
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c synchronous_commit=off
      -c fsync=on
      -c full_page_writes=on

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flextest_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - flextest-network

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    platform: linux/amd64
    image: redis:7-alpine
    container_name: flextest-redis
    restart: unless-stopped
    env_file:
      - docker/config/common.env

    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --tcp-keepalive 300
      --timeout 0
      --databases 16
      --loglevel notice
      --maxclients 10000

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - flextest-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 512M

  # ============================================
  # PgBouncer Connection Pooler
  # ============================================
  pgbouncer:
    platform: linux/amd64
    image: edoburu/pgbouncer:latest
    container_name: flextest-pgbouncer
    restart: unless-stopped
    env_file:
      - docker/config/common.env

    ports:
      - "${PGBOUNCER_PORT:-6433}:5432"

    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-flextest_db}
      DB_USER: ${POSTGRES_USER:-prod_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-QSbM08uqLc7nK81WZfw53/ID+fJ6UAL8}
      AUTH_TYPE: md5
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-10000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-100}
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 25
      RESERVE_POOL_TIMEOUT: 3
      MAX_DB_CONNECTIONS: 150
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      SERVER_CONNECT_TIMEOUT: 15
      QUERY_TIMEOUT: 60
      QUERY_WAIT_TIMEOUT: 120
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
      ADMIN_USERS: admin
      STATS_USERS: stats

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - flextest-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # FlexTest Backend (Fastify)
  # ============================================
  flextest-backend:
    platform: linux/amd64
    image: volttechafrica/flextest-backend:latest
    # container_name: flextest-backend
    restart: unless-stopped
    env_file:
      - docker/config/common.env

    ports:
      - "${BACKEND_PORT:-3000}:8000"
      - "${GRPC_PORT:-50051}:50051"

    environment:
      NODE_ENV: production
      # DATABASE_URL and DIRECT_URL loaded from common.env (properly URL-encoded)
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - app_logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started

    networks:
      - flextest-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # FlexTest Frontend (Next.js)
  # ============================================
  # flextest-frontend:
  #   # platform: linux/amd64
  #   image: volttechafrica/flextest:latest
  #   container_name: flextest-frontend
  #   restart: unless-stopped
  #   env_file:
  #     - docker/config/common.env

  #   ports:
  #     - "${FRONTEND_PORT:-3001}:3001"

  #   environment:
  #     NODE_ENV: production
  #     PORT: 3001
  #     NEXT_PUBLIC_API_URL: http://flextest-backend:3000/v1/api

  #   depends_on:
  #     flextest-backend:
  #       condition: service_healthy

  #   networks:
  #     - flextest-network

  #   healthcheck:
  #     test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1'
  #         memory: 1G
  #       reservations:
  #         cpus: '0.25'
  #         memory: 512M

# ============================================
# Networks
# ============================================
networks:
  flextest-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
